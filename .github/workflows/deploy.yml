name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Test interactive demo
        run: npm test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install nbconvert==7.16.6
      - name: Build production site
        env:
          JEKYLL_ENV: production
          BUNDLE_FROZEN: "true"
        run: bundle exec jekyll build --trace
      - name: Check public CV source and PDF consistency
        run: npm run cv:check
      - name: Check generated site
        run: npm run site:check
      - name: Prepare static Pages output
        run: touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
